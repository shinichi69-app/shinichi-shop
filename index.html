<!DOCTYPE html>
<html lang="th">
<head>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      getDocs, 
      addDoc, 
      updateDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCGG103Vc3C7xhgW-4XQRU4K0OzuotLx-I",
      authDomain: "login-15303.firebaseapp.com",
      projectId: "login-15303",
      storageBucket: "login-15303.firebasestorage.app",
      messagingSenderId: "403564723749",
      appId: "1:403564723749:web:c9fb83e920ec2cbfb049cc"
    };

    try {
      const app = initializeApp(firebaseConfig);
      window.firebaseAuth = getAuth(app);
      window.firebaseDb = getFirestore(app);
      window.firebaseFunctions = { 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged, 
        updateProfile, 
        doc, 
        setDoc, 
        getDoc, 
        collection, 
        getDocs, 
        addDoc, 
        updateDoc, 
        deleteDoc 
      };
      console.log("✅ Firebase initialized successfully");
    } catch (error) {
      console.error("❌ Firebase initialization error:", error);
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    
    .wall-switch-plate { background: linear-gradient(145deg, #27272a, #18181b); box-shadow: 8px 8px 16px #09090b, -8px -8px 16px #3f3f46; transition: transform 0.1s ease; }
    .wall-switch-plate:active { transform: scale(0.97); }
    .switch-knob { transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2); }
    .switch-knob.on { transform: translateX(100%); background: linear-gradient(145deg, #fbbf24, #d97706); box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }
    #loginOverlay { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease; }
    .tab-btn { transition: all 0.3s ease; }
    .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #18181b; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #f59e0b; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
    
    .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.25); }
    .cat-pill { transition: all 0.2s ease; }
    .cat-pill.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #18181b; border-color: transparent; }
    .admin-badge { background: linear-gradient(135deg, #ef4444, #dc2626); }
  </style>
</head>

  <script type="module">
    console.log("🚀 Script started");

    const waitForFirebase = () => new Promise((resolve, reject) => {
      let attempts = 0;
      const maxAttempts = 50;
      const check = () => {
        attempts++;
        if (window.firebaseAuth && window.firebaseFunctions) {
          console.log("✅ Firebase ready");
          resolve();
        } else if (attempts >= maxAttempts) {
          console.error("❌ Firebase initialization timeout");
          reject(new Error("Firebase initialization timeout"));
        } else {
          setTimeout(check, 100);
        }
      };
      check();
    });

    try {
      await waitForFirebase();

      const auth = window.firebaseAuth;
      const db = window.firebaseDb;
      const { 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged, 
        updateProfile,
        doc,
        setDoc
      } = window.firebaseFunctions;

      const ADMIN_EMAIL = "popsteptep555@gmail.com";

      // UI Elements
      const loginOverlay = document.getElementById('loginOverlay');
      const wallSwitch = document.getElementById('wallSwitch');
      const switchKnob = document.getElementById('switchKnob');
      const switchTrackGlow = document.getElementById('switchTrackGlow');
      const switchLed = document.getElementById('switchLed');
      const switchLabel = document.getElementById('switchLabel');
      const loginTabBtn = document.getElementById('loginTabBtn');
      const signupTabBtn = document.getElementById('signupTabBtn');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const errorMsg = document.getElementById('errorMsg');

      function showError(msg) { 
        console.error("❌ Error:", msg);
        errorMsg.textContent = msg; 
        errorMsg.classList.remove('hidden'); 
        setTimeout(() => errorMsg.classList.add('hidden'), 5000); 
      }
      function hideError() { errorMsg.classList.add('hidden'); }

      // Tab Switching
      loginTabBtn.addEventListener('click', () => {
        loginTabBtn.classList.add('active'); 
        signupTabBtn.classList.remove('active');
        loginForm.classList.remove('hidden'); 
        signupForm.classList.add('hidden'); 
        hideError();
      });
      signupTabBtn.addEventListener('click', () => {
        signupTabBtn.classList.add('active'); 
        loginTabBtn.classList.remove('active');
        signupForm.classList.remove('hidden'); 
        loginForm.classList.add('hidden'); 
        hideError();
      });

      // Wall Switch Toggle
      function toggleSwitch() {
        const isOn = switchKnob.classList.toggle('on');
        switchTrackGlow.classList.toggle('opacity-0', !isOn);
        switchLed.classList.toggle('bg-red-900/50', !isOn);
        switchLed.classList.toggle('bg-amber-400', isOn);
        switchLed.classList.toggle('shadow-[0_0_10px_rgba(251,191,36,0.8)]', isOn);
        switchLabel.innerHTML = isOn 
          ? `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.8)]"></span> ระบบพร้อมใช้งาน`
          : `<span class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span> แตะสวิตช์เพื่อเข้าสู่ระบบ`;
        switchLabel.classList.toggle('animate-pulse', !isOn);
        switchLabel.classList.toggle('text-zinc-500', !isOn);
        switchLabel.classList.toggle('text-amber-400', isOn);

        if (isOn) {
          loginOverlay.classList.remove('pointer-events-none', 'opacity-0', '-translate-y-full');
          loginOverlay.classList.add('translate-y-0', 'opacity-100');
          setTimeout(() => document.getElementById('loginEmail').focus(), 600);
        } else {
          closeLogin();
        }
      }

      function closeLogin() {
        switchKnob.classList.remove('on');
        switchTrackGlow.classList.add('opacity-0');
        switchLed.classList.add('bg-red-900/50');
        switchLed.classList.remove('bg-amber-400', 'shadow-[0_0_10px_rgba(251,191,36,0.8)]');
        switchLabel.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span> แตะสวิตช์เพื่อเข้าสู่ระบบ`;
        switchLabel.classList.add('animate-pulse', 'text-zinc-500');
        switchLabel.classList.remove('text-amber-400');
        loginOverlay.classList.add('opacity-0', '-translate-y-full');
        loginOverlay.classList.remove('translate-y-0', 'opacity-100');
        loginForm.reset(); 
        signupForm.reset(); 
        hideError();
        setTimeout(() => loginOverlay.classList.add('pointer-events-none'), 500);
      }

      wallSwitch.addEventListener('click', toggleSwitch);
      document.getElementById('closeLoginBtn').addEventListener('click', closeLogin);

      // Handle Login
      window.handleLogin = async function() {
        console.log("🔐 Login attempt started");
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        
        if (!email || !password) { 
          showError('กรุณากรอกอีเมลและรหัสผ่าน'); 
          return; 
        }
        
        btn.disabled = true; 
        btn.innerHTML = `<div class="spinner"></div> <span>กำลังเข้าสู่ระบบ...</span>`; 
        hideError();

        try {
          console.log("📡 Calling Firebase signInWithEmailAndPassword...");
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          console.log("✅ Login successful:", userCredential.user.email);
        } catch (error) {
          console.error("❌ Login error:", error.code, error.message);
          let msg = 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
          
          if (error.code === 'auth/user-not-found') msg = 'ไม่พบบัญชีนี้ในระบบ';
          else if (error.code === 'auth/wrong-password') msg = 'รหัสผ่านไม่ถูกต้อง';
          else if (error.code === 'auth/invalid-email') msg = 'รูปแบบอีเมลไม่ถูกต้อง';
          else if (error.code === 'auth/invalid-credential') msg = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
          else if (error.code === 'auth/too-many-requests') msg = 'พยายามเข้าสู่ระบบมากเกินไป กรุณารอสักครู่';
          else if (error.code === 'auth/network-request-failed') msg = 'ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้';
          else msg = `Error: ${error.code || error.message}`;
          
          showError(msg);
          btn.disabled = false; 
          btn.innerHTML = `<span>เข้าสู่ระบบ</span>`;
        }
      };

      // Handle Signup
      window.handleSignup = async function() {
        console.log("📝 Signup attempt started");
        const username = document.getElementById('signupUsername').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const btn = document.getElementById('signupBtn');
        
        if (!username || !email || !password) { 
          showError('กรุณากรอกข้อมูลให้ครบ'); 
          return; 
        }
        if (password.length < 6) { 
          showError('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); 
          return; 
        }
        
        btn.disabled = true; 
        btn.innerHTML = `<div class="spinner"></div> <span>กำลังสมัคร...</span>`; 
        hideError();

        try {
          console.log("📡 Calling Firebase createUserWithEmailAndPassword...");
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          console.log("✅ Signup successful:", cred.user.email);
          
          await updateProfile(cred.user, { displayName: username });
          console.log("✅ Profile updated");
          
          try { 
            await setDoc(doc(db, "users", cred.user.uid), { 
              username, 
              email, 
              createdAt: new Date().toISOString() 
            });
            console.log("✅ User data saved to Firestore");
          } catch(e) {
            console.warn("⚠️ Firestore save failed:", e);
          }
        } catch (error) {
          console.error("❌ Signup error:", error.code, error.message);
          let msg = 'เกิดข้อผิดพลาดในการสมัคร';
          
          if (error.code === 'auth/email-already-in-use') msg = 'อีเมลนี้ถูกใช้งานแล้ว';
          else if (error.code === 'auth/invalid-email') msg = 'รูปแบบอีเมลไม่ถูกต้อง';
          else if (error.code === 'auth/weak-password') msg = 'รหัสผ่านอ่อนเกินไป (อย่างน้อย 6 ตัวอักษร)';
          else msg = `Error: ${error.code || error.message}`;
          
          showError(msg);
          btn.disabled = false; 
          btn.innerHTML = `<span>สมัครสมาชิก</span>`;
        }
      };

      // Auth State Observer
      onAuthStateChanged(auth, (user) => {
        console.log("👤 Auth state changed:", user ? user.email : 'logged out');
        
        const loginPage = document.getElementById('loginPage');
        const dashboardPage = document.getElementById('dashboardPage');
        const adminBtn = document.getElementById('adminBtn');
        const adminBadge = document.getElementById('adminBadge');

        if (user) {
          loginPage.classList.add('hidden');
          dashboardPage.classList.remove('hidden');
          
          document.getElementById('displayUsername').textContent = user.displayName || 'User';
          document.getElementById('displayEmail').textContent = user.email;
          
          if (user.email === ADMIN_EMAIL) {
            adminBtn.classList.remove('hidden');
            adminBadge.classList.remove('hidden');
            console.log("✅ Admin access granted");
          } else {
            adminBtn.classList.add('hidden');
            adminBadge.classList.add('hidden');
          }
        } else {
          loginPage.classList.remove('hidden');
          dashboardPage.classList.add('hidden');
        }
      });

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
          try {
            await signOut(auth);
            console.log("✅ Logged out");
          } catch (error) {
            console.error("❌ Logout error:", error);
          }
        }
      });

      console.log("✅ All event listeners attached");

    } catch (error) {
      console.error("❌ Fatal error:", error);
      alert("เกิดข้อผิดพลาด: " + error.message);
    }
  </script>
</body>
</html>
